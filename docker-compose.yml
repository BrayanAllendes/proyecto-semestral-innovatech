version: '3.8'

services:
  # 1. Base de Datos con persistencia
  db:
    image: mysql:8.0
    container_name: db_innovatech
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innovatech_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Backend Despachos
  back-despachos:
    build: 
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: backend_despachos
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=innovatech_db
      - DB_USER=root
      - DB_PASSWORD=root

  # 3. Backend Ventas
  back-ventas:
    build: 
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: backend_ventas
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=innovatech_db
      - DB_USER=root
      - DB_PASSWORD=root

  # 4. Frontend React
  frontend:
    build:
      context: ./front_despacho
    container_name: frontend_react
    ports:
      - "80:80"
    depends_on:
      - back-despachos
      - back-ventas

volumes:
  db_data: